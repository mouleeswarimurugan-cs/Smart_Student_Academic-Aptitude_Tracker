
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>
        {% block title %}
        Smart Student Academic &amp; Aptitude Tracker
        {% endblock %}
    </title>

    <!-- Bootstrap CSS only -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>
        :root {
            --primary-dark: #1e1b4b;
            --primary: #312e81;
            --primary-light: #4c1d95;
            --page-bg: #f7f5fc;
            --text-color: #211d38;
            --accent: #ddd6fe;
            --purple: #6d28d9;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: var(--page-bg);
            color: var(--text-color);
        }

        /* =========================
           NAVBAR - DESKTOP
        ========================= */

        .navbar-custom {
            position: relative;
            z-index: 1000;
            background: linear-gradient(
                135deg,
                var(--primary-dark),
                var(--primary),
                var(--primary-light)
            );
            box-shadow: 0 5px 20px rgba(30, 27, 75, 0.18);
            padding: 16px 0;
        }

        .navbar-custom .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .navbar-brand {
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            margin: 0;
            line-height: 1.5;
            flex-shrink: 0;
        }

        .navbar-brand:hover {
            color: var(--accent);
        }


        .menu-checkbox {
            display: none;
        }


        .menu-toggle {
            display: none;
        }


        .navbar-links {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            flex-wrap: wrap;
            gap: 5px;
            list-style: none;
            margin: 0 0 0 auto;
            padding: 0;
        }

        .navbar-links li {
            margin: 0;
            padding: 0;
        }

        .navbar-links a {
            display: block;
            color: #f5f3ff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            padding: 10px 12px;
            border-radius: 8px;
            transition: background-color 0.2s ease;
        }

        .navbar-links a:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
        }

        .main-content {
            min-height: calc(100vh - 80px);
            padding: 35px 0;
            background:
                radial-gradient(
                    circle at top right,
                    rgba(124, 58, 237, 0.06),
                    transparent 35%
                ),
                var(--page-bg);
        }


        .btn-primary {
            background-color: var(--primary);
            border-color: var(--primary);
        }

        .btn-primary:hover,
        .btn-primary:focus {
            background-color: var(--primary-dark);
            border-color: var(--primary-dark);
        }

        .btn-outline-primary {
            color: var(--primary);
            border-color: var(--primary);
        }

        .btn-outline-primary:hover {
            color: #ffffff;
            background-color: var(--primary);
            border-color: var(--primary);
        }


        .card {
            border: 1px solid #ebe7f6;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(49, 46, 129, 0.06);
        }

        .card-header {
            background-color: #ede9fe;
            color: var(--primary-dark);
            font-weight: bold;
        }


        .form-control:focus,
        .form-select:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 0 0.2rem rgba(139, 92, 246, 0.15);
        }

        .form-label {
            font-weight: 600;
            color: var(--primary-dark);
        }


        .table thead th {
            background-color: #ede9fe;
            color: var(--primary-dark);
            white-space: nowrap;
        }

        .table td {
            vertical-align: middle;
        }


        .alert {
            border-radius: 10px;
            margin-bottom: 20px;
        }


        @media (min-width: 576px) and (max-width: 991.98px) {

            .navbar-custom .container {
                flex-wrap: wrap;
            }

            .navbar-brand {
                font-size: 17px;
            }

            .navbar-links {
                width: 100%;
                justify-content: flex-start;
            }
        }


        @media (max-width: 575.98px) {

            .navbar-custom {
                padding: 12px 0;
            }

            .navbar-custom .container {
                display: flex;
                align-items: center;
                flex-wrap: wrap;
                gap: 10px;
            }

            .navbar-brand {
                font-size: 14px;
                flex: 1;
                min-width: 0;
            }


            .menu-toggle {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 5px;
                width: 44px;
                height: 42px;
                padding: 8px;
                border: 1px solid rgba(255, 255, 255, 0.5);
                border-radius: 8px;
                cursor: pointer;
                flex-shrink: 0;
                user-select: none;
            }

            .menu-toggle span {
                display: block;
                width: 22px;
                height: 2px;
                background-color: #ffffff;
                border-radius: 2px;
            }

            .menu-toggle:hover {
                background: rgba(255, 255, 255, 0.15);
            }


            .navbar-links {
                display: none;
                flex-direction: column;
                align-items: stretch;
                justify-content: flex-start;
                width: 100%;
                margin: 0;
                padding: 10px;
                gap: 4px;
                background: var(--primary-dark);
                border-radius: 10px;
                box-shadow: 0 8px 20px rgba(30, 27, 75, 0.22);
            }


            .menu-checkbox:checked ~ .navbar-links {
                display: flex;
            }

            .navbar-links li {
                width: 100%;
            }

            .navbar-links a {
                width: 100%;
                display: block;
                padding: 12px 14px;
                font-size: 14px;
                text-align: left;
                border-radius: 7px;
            }

            .main-content {
                padding: 22px 0;
            }

            .container {
                padding-left: 16px;
                padding-right: 16px;
            }

            h1 {
                font-size: 1.6rem;
            }

            h2 {
                font-size: 1.35rem;
            }

            .table-responsive {
                overflow-x: auto;
            }

            .btn {
                max-width: 100%;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar-custom">
        <div class="container">

            <!-- Website title -->
           <a class="navbar-brand brand-name" href="{% url 'home' %}">
    🎓 Smart Student Academic & Aptitude Tracker
</a>

            <input
                type="checkbox"
                id="menu-toggle"
                class="menu-checkbox">

            <label
                for="menu-toggle"
                class="menu-toggle"
                aria-label="Toggle navigation menu">

                <span></span>
                <span></span>
                <span></span>

            </label>

            <ul class="navbar-links">

                <li>
                    <a href="{% url 'dashboard' %}">
                        Dashboard
                    </a>
                </li>

                <li>
                    <a href="{% url 'subject_list' %}">
                        Subjects
                    </a>
                </li>

                <li>
                    <a href="{% url 'assignment_list' %}">
                        Assignments
                    </a>
                </li>

                <li>
                    <a href="{% url 'aptitude_dashboard' %}">
                        Aptitude
                    </a>
                </li>

                <li>
                    <a href="{% url 'logout' %}">
                        Logout
                    </a>
                </li>

            </ul>

        </div>
    </nav>



    <main class="main-content">
        <div class="container">

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-info" role="alert">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            {% block content %}
            {% endblock %}

        </div>
    </main>

</body>
</html>
