
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>
        {% block title %}
        Smart Student Academic &amp; Aptitude Tracker
        {% endblock %}
    </title>

    <!-- Bootstrap CSS only - No JavaScript -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>
        :root {
            --primary-dark: #1e1b4b;
            --primary: #312e81;
            --primary-light: #4c1d95;
            --page-bg: #f7f5fc;
            --text-color: #211d38;
            --accent: #ddd6fe;
            --purple: #6d28d9;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: var(--page-bg);
            color: var(--text-color);
        }

        /* =========================
           TOP NAVIGATION BAR
        ========================= */

        .navbar-custom {
            background: linear-gradient(
                135deg,
                var(--primary-dark),
                var(--primary),
                var(--primary-light)
            );
            box-shadow: 0 5px 20px rgba(30, 27, 75, 0.18);
            padding: 20px 0;
        }

        .navbar-custom .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
        }

        /* Website title - Left side */

        .navbar-brand {
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            margin: 0;
            line-height: 1.5;
            flex-shrink: 0;
        }

        .navbar-brand:hover {
            color: var(--accent);
        }

        /* Menu links - Right side */

        .navbar-links {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            flex-wrap: wrap;
            gap: 5px;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .navbar-links li {
            margin: 0;
            padding: 0;
        }

        .navbar-links a {
            display: block;
            color: #f5f3ff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            padding: 10px 12px;
            border-radius: 8px;
            transition: background-color 0.2s ease;
        }

        .navbar-links a:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
        }

        /* =========================
           MAIN PAGE CONTENT
        ========================= */

        .main-content {
            min-height: calc(100vh - 80px);
            padding: 35px 0;
            background:
                radial-gradient(
                    circle at top right,
                    rgba(124, 58, 237, 0.06),
                    transparent 35%
                ),
                var(--page-bg);
        }

        /* =========================
           BUTTONS
        ========================= */

        .btn-primary {
            background-color: var(--primary);
            border-color: var(--primary);
        }

        .btn-primary:hover,
        .btn-primary:focus {
            background-color: var(--primary-dark);
            border-color: var(--primary-dark);
        }

        .btn-outline-primary {
            color: var(--primary);
            border-color: var(--primary);
        }

        .btn-outline-primary:hover {
            color: #ffffff;
            background-color: var(--primary);
            border-color: var(--primary);
        }

        /* =========================
           CARDS
        ========================= */

        .card {
            border: 1px solid #ebe7f6;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(49, 46, 129, 0.06);
        }

        .card-header {
            background-color: #ede9fe;
            color: var(--primary-dark);
            font-weight: bold;
        }

        /* =========================
           FORMS
        ========================= */

        .form-control:focus,
        .form-select:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 0 0.2rem rgba(139, 92, 246, 0.15);
        }

        .form-label {
            font-weight: 600;
            color: var(--primary-dark);
        }

        /* =========================
           TABLES
        ========================= */

        .table thead th {
            background-color: #ede9fe;
            color: var(--primary-dark);
            white-space: nowrap;
        }

        .table td {
            vertical-align: middle;
        }

        /* =========================
           ALERT MESSAGES
        ========================= */

        .alert {
            border-radius: 10px;
            margin-bottom: 20px;
        }

        /* =========================
           TABLET RESPONSIVE
        ========================= */

        @media (max-width: 991.98px) {
            .navbar-custom .container {
                align-items: flex-start;
            }

            .navbar-brand {
                width: 100%;
                font-size: 17px;
            }

            .navbar-links {
                justify-content: flex-start;
                width: 100%;
            }
        }

        /* =========================
           MOBILE RESPONSIVE
        ========================= */

        @media (max-width: 575.98px) {
            .navbar-custom {
                padding: 15px 0;
            }

            .navbar-custom .container {
                gap: 10px;
            }

            .navbar-brand {
                font-size: 16px;
            }

            .navbar-links {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 5px;
                width: 100%;
            }

            .navbar-links a {
                font-size: 13px;
                padding: 9px 8px;
                text-align: center;
            }

            .main-content {
                padding: 22px 0;
            }

            .container {
                padding-left: 16px;
                padding-right: 16px;
            }

            h1 {
                font-size: 1.6rem;
            }

            h2 {
                font-size: 1.35rem;
            }

            .table-responsive {
                overflow-x: auto;
            }

            .btn {
                max-width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- TOP NAVIGATION -->
    <nav class="navbar-custom">
        <div class="container">

            <!-- Website title: LEFT -->
            <a class="navbar-brand"
               href="{% url 'dashboard' %}">
                🎓 Smart Student Academic &amp; Aptitude Tracker
            </a>

            <!-- Menu links: RIGHT -->
            <ul class="navbar-links">

                <li>
                    <a href="{% url 'dashboard' %}">
                        Dashboard
                    </a>
                </li>

                <li>
                    <a href="{% url 'subject_list' %}">
                        Subjects
                    </a>
                </li>

                <li>
                    <a href="{% url 'assignment_list' %}">
                        Assignments
                    </a>
                </li>

                <li>
                    <a href="{% url 'aptitude_dashboard' %}">
                        Aptitude
                    </a>
                </li>

                <li>
                    <a href="{% url 'logout' %}">
                        Logout
                    </a>
                </li>

            </ul>

        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        <div class="container">

            <!-- Django Messages -->
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-info" role="alert">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <!-- Individual Page Content -->
            {% block content %}
            {% endblock %}

        </div>
    </main>

</body>
</html>
